# EXACT syntax from example.yaml
sensor:
  - platform: tof_vl53l1x
    name: "Distance"
    update_interval: 250ms
    distance_mode: long
    timing_budget_ms: 150000
    intermeasurement_ms: 250
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    accuracy_decimals: 0
    unit_of_measurement: "mm"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
