substitutions:
  device_name: tof-top-steps
  friendly_name: TOF-Top Steps

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Manual component code embedded (workaround for external component issues)
  includes:
    - vl53l1x_sensor.h
  libraries:
    - "pololu/VL53L1X"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "xZ8yia42psem/pM8EitSf9pGFG4SefX6Q/WrA63BUCg="

# Enable OTA updates
ota:
  - platform: esphome
    password: "2709128908f68863b5709e9c97e0b1a1"

# WiFi configuration
wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"

  ap:
    ssid: "${friendly_name} Fallback"
    password: "Bt0UHxek49rg"

captive_portal:

# I2C Bus configuration
i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

# Custom sensor using library directly
sensor:
  - platform: custom
    lambda: |-
      auto vl53 = new VL53L1XSensor();
      App.register_component(vl53);
      return {vl53};
    sensors:
      - name: "Distance"
        unit_of_measurement: "mm"
        accuracy_decimals: 0
        icon: "mdi:ruler"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
