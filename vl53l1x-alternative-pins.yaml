substitutions:
  device_name: vl53l1x-updated
  friendly_name: VL53L1X_UPDATED

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source: github://soldierkam/vl53l1x_sensor
    refresh: 1d

logger:
  level: DEBUG

api:
  encryption:
    key: "ExDe1QCbYpuNItTeQfaDDVw36cvxRa7h+XcrT1MGuKk="

ota:
  - platform: esphome
    password: "b4154cf408567485aa609e3c16a25076"

wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"

  ap:
    ssid: "VL53L1X-Updated Fallback"
    password: "DRnjJo6OUJwd"

captive_portal:

# Try DIFFERENT I2C pins - sometimes GPIO20/21 have issues
i2c:
  sda: GPIO2   # Changed from GPIO20
  scl: GPIO3   # Changed from GPIO21
  scan: true
  frequency: 100kHz

sensor:
  - platform: vl53l1x_sensor
    name: "Distance"
    id: tof_distance
    distance_mode: SHORT
    timing_budget: 100ms
    update_interval: 2s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "Step Occupied"
    id: step_occupied
    lambda: |-
      if (isnan(id(tof_distance).state)) {
        return {};
      }
      if (id(tof_distance).state < 1.20) {
        return true;
      } else {
        return false;
      }

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
