substitutions:
  device_name: vl53l1x-updated
  friendly_name: VL53L1X_UPDATED

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Use cptkirki's TOF400C VL53L1X component - LOCAL
external_components:
  - source: C:/Users/jerem/Documents/ESPHOME_PROJECTS/EXTERNAL_COMPONENTS/TOF400c
    refresh: always

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "ExDe1QCbYpuNItTeQfaDDVw36cvxRa7h+XcrT1MGuKk="

# Enable OTA updates
ota:
  - platform: esphome
    password: "b4154cf408567485aa609e3c16a25076"

# WiFi configuration
wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"

  # Enable fallback hotspot
  ap:
    ssid: "VL53L1X-Updated Fallback"
    password: "DRnjJo6OUJwd"

captive_portal:

# I2C Bus configuration
i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

# VL53L1X using cptkirki's TOF400C component with proper syntax
sensor:
  - platform: tof_vl53l1x
    name: "Distance"
    id: tof_distance
    update_interval: 250ms
    distance_mode: long          # lowercase: short, medium, or long
    timing_budget_ms: 200000     # 200ms in microseconds
    intermeasurement_ms: 1000    # 1 second between measurements
    accuracy_decimals: 0
    unit_of_measurement: "mm"    # millimeters (not meters!)

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# Binary sensor for step detection
binary_sensor:
  - platform: template
    name: "Step Occupied"
    id: step_occupied
    lambda: |-
      if (isnan(id(tof_distance).state)) {
        return {};
      }
      if (id(tof_distance).state < 1220) {  // Distance in mm
        return true;
      } else {
        return false;
      }

# Text sensors for debugging
text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
