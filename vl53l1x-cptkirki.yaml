substitutions:
  device_name: vl53l1x-updated
  friendly_name: VL53L1X_UPDATED

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Use cptkirki's TOF400C VL53L1X component
external_components:
  - source: github://cptkirki/TOF400C-VL53L1X-esphome
    refresh: 1d

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "ExDe1QCbYpuNItTeQfaDDVw36cvxRa7h+XcrT1MGuKk="

# Enable OTA updates
ota:
  - platform: esphome
    password: "b4154cf408567485aa609e3c16a25076"

# WiFi configuration
wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"

  # Enable fallback hotspot
  ap:
    ssid: "VL53L1X-Updated Fallback"
    password: "DRnjJo6OUJwd"

captive_portal:

# I2C Bus configuration
i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

# VL53L1X using cptkirki's component (designed for TOF400C module)
sensor:
  - platform: tof400c
    name: "Distance"
    id: tof_distance
    update_interval: 1s
    # This component is specifically designed for the TOF400C module
    # which uses the VL53L1X sensor

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# Binary sensor for step detection
binary_sensor:
  - platform: template
    name: "Step Occupied"
    id: step_occupied
    lambda: |-
      if (isnan(id(tof_distance).state)) {
        return {};
      }
      if (id(tof_distance).state < 1220) {  // Distance in mm
        return true;
      } else {
        return false;
      }

# Text sensors for debugging
text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
