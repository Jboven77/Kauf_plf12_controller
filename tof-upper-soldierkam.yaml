substitutions:
  device_name: tof-upper
  friendly_name: ToF-Upper

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Use BETTER VL53L1X component from soldierkam (supports full 4m range!)
external_components:
  - source: github://soldierkam/vl53l1x_sensor
    refresh: 1d

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "9kx/l0p11p7WitS63E1X7bg0KgcTPgdD4zFafyUblX8="

# Enable OTA updates
ota:
  - platform: esphome
    password: "b6741b50e8e5f0e85451a25809f51227"

# WiFi configuration
wifi:
  ssid: "BOVENS-MESH"
  password: "605506Jdb"

  # Enable fallback hotspot
  ap:
    ssid: "ToF-Upper Fallback"
    password: "4NEmeVb8YkqL"

captive_portal:

# I2C Bus configuration (400kHz recommended for VL53L1X)
i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 400kHz

# VL53L1X Time-of-Flight Sensor (PROPER IMPLEMENTATION!)
sensor:
  - platform: vl53l1x_sensor
    name: "Distance"
    id: tof_distance
    distance_mode: HIGH  # Up to 4m (13 feet)
    timing_budget: 100ms  # Good balance for 4ft range
    update_interval: 500ms

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# Binary sensor for step detection (triggers when distance < 4ft)
binary_sensor:
  - platform: template
    name: "Step Occupied"
    id: step_occupied
    lambda: |-
      if (id(tof_distance).state < 1220) {
        return true;  // Someone is on the steps (beam broken, distance < 4ft)
      } else {
        return false;  // Steps are clear
      }

# Text sensors for debugging
text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
